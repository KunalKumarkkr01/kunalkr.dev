# kunalOS 95 - nginx server block for the static portfolio.
#
# Dropped in at /etc/nginx/conf.d/default.conf, replacing the stock one.
# Everything the page needs is served from this origin (React, the webfonts and
# every icon are vendored into site/), so no external host is allowed anywhere.

# Cache policy by path. Kept in a map so every Cache-Control decision lives in
# one place and can be emitted by a single server-level add_header - nginx drops
# inherited add_headers the moment a location adds one of its own, so per-location
# caching would silently strip the security headers below.
map $uri $kunalos_cache {
    # Most files keep their name when their content changes (scene.js, the models, the
    # résumé PDF, photos), so browsers must revalidate them: a deploy then shows up on the
    # next visit, and an unchanged file costs only a 304 thanks to nginx's ETag.
    default                                    "no-cache";

    # Icons named by their content hash (16 hex digits) never change: cache for a year.
    "~*/[0-9a-f]{16}\.(png|gif|jpe?g|svg)$"    "public, max-age=31536000, immutable";

    # Vendored libraries and webfonts change only with a deliberate upgrade: a week.
    "~*^/(vendor|fonts)/"                      "public, max-age=604800";

    # Crawler-facing files, refreshed cheaply.
    "~*^/(robots\.txt|sitemap\.xml|og\.png)$"  "public, max-age=3600";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    add_header Cache-Control      $kunalos_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy    "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options    "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # blob: in img-src lets GLTFLoader decode textures embedded in the 3D desk's .glb models.
    # 'unsafe-eval' is unavoidable: the dc-runtime in support.js compiles the
    # page's own <script type="text/x-dc"> template with new Function(). Every
    # other directive is locked to this origin because nothing loads off-site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json application/xml image/svg+xml model/gltf-binary;

    # The pre-hydration markup carries literal `src="{{ a.icon32 }}"` bindings.
    # Chrome's preload scanner speculatively fetches those paths before the
    # runtime substitutes them, which shows up as a handful of console 404s.
    # Answering 204 keeps a visitor's DevTools clean; the runtime never needs
    # these responses.
    location ~ "^/\{\{" {
        access_log off;
        return 204;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # The 3D desk's models. nginx's stock mime.types has no .glb entry (it would go out as
    # application/octet-stream, which gzip_types skips); the geometry in office-assets.glb
    # compresses to under half its size. A types block here only affects this location.
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        try_files $uri =404;
    }

    # Static site, no client-side router: a genuinely missing path is a 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
